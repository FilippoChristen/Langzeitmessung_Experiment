# Heimdalls Ear CPU1 configuration, schema 1.
# Optional overrides; omitted/invalid values use compiled defaults.
# SD edits load at boot. PC import applies to RAM; config NODE apply saves RAM.
# Password is intentionally plain text on SD.
[config]
version=1

[node]
# Optional CLI alias: 1..15 letters/digits/_/-. Choose a unique name per node.
nickname=6

[battery]
low_warning_mv=3400
cutoff_mv=3200
cutoff_delay_s=10

[halow]
enabled=true
ssid=halowlink2-7e17
password=rover73twice5lazy
country=EU
# Set auto when moving to an AP with another BSSID.
bssid=50:2E:91:D2:CC:10

[network]
# Existing startup enables DHCP; addresses below are DHCP fallbacks.
mode=dhcp
ip=192.168.12.112
netmask=255.255.255.0
# Preserve the actual startup gateway, which differs from IP_GATEWAY.
gateway=192.168.12.157
dns=8.8.8.8

[event]
# PC address reachable through HaLowLink2; match --port in tools/event_node.py.
server_ip=192.168.12.157
port=5005

[aad]
# Analog AAD only; Digital modes keep the MCU awake.
standby=true
transmission_correction_ms=0
contact_window_s=5
retry_interval_s=1000

[storage]
# Total usable event capacity in BYTES, not remaining capacity. 0 = FAT geometry.
sd_size=0
# Combined stereo PCM + GEO text + timing allowance; calibrate with actual files.
recording_size_per_second=82000

[geophone]
# Listening profile; activated only when event mode is armed and enabled=true.
# Default continuous/off is preserved; choose duty_cycle + 1/4 or 1/16 for low power.
enabled=false
sample_rate_sps=2400
gain=128
filter=sinc3
mode=duty_cycle
duty_cycle=1/16
# Input-referred symmetric threshold in uV; 10000 is an example, not a calibrated event criterion.
threshold_uv=300

[geophone_recording]
# Separate boot-test and event recording profile. Threshold interrupts are disabled here.
sample_rate_sps=500
gain=128
filter=sinc3
mode=continuous
duty_cycle=off

[recording]
seconds=2

[mic1]
enabled=true
mode=analog
analog_threshold=9
analog_lpf=1
floor=22
absolute_threshold=275
relative_threshold=36
relative_pulse_min=0
absolute_pulse_min=0

[mic2]
enabled=true
mode=analog
analog_threshold=9
analog_lpf=1
floor=22
absolute_threshold=275
relative_threshold=36
relative_pulse_min=0
absolute_pulse_min=0
